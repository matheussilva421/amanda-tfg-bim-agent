      the program brief needs
  python:
    semantic: python
    availability: NOT_AVAILABLE
    justification: There is no Python surface. A scan of all 288 names and descriptions for python, code
      or script returns exactly one tool, send_code_to_revit, which executes C# through a sandbox rather
      than Python. RevitCortex.Core also carries no IronPython or Python runtime reference. The nearest
      surface is therefore not equivalent, and CodeSandboxV2 additionally strips comments and string literals
      before matching a denylist of System.IO, System.Net, System.Diagnostics.Process, Microsoft.Win32,
      System.Reflection, System.Runtime.InteropServices, dynamic, Invoke( and GetTypes(.
    verified_alternative: 'The Horizun provider owns arbitrary-code execution on this machine: horizun_execute_python
      is granted and was exercised for real in P02-T12 (tool-lab/horizun/results/t12-toposolid.json).
      For Cortex, an equivalent capability would be send_code_to_revit, which is disabled by decision
      (EnableCodeExecution is false in the settings file) and must stay disabled; it also cannot be reached
      through the settings file without the owner. The P02-T15 A/B smoke must therefore compare the typed
      Cortex tools against the typed Horizun tools and record that the Python route has no Cortex twin.'
    disabled_nearest_surface: send_code_to_revit
    catalog_scan:
      tools_matching_python_code_script:
      - send_code_to_revit
      language: C#
      sandbox_denylist:
      - System.IO
      - System.Net
      - System.Diagnostics.Process
      - Microsoft.Win32
      - System.Reflection
      - System.Runtime.InteropServices
      - dynamic
      - Invoke(
      - GetTypes(

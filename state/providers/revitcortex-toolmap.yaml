  site_toposolid:
    semantic: site_toposolid
    availability: NOT_AVAILABLE
    justification: 'No published Cortex tool mentions a toposolid, topographic surface, site, grading,
      terrain or mass in its name or description: a scan of all 288 tool names and descriptions returns
      zero matches. The only surface-based creation tool, create_surface_based_element, is documented
      as floors and ceilings. The project site data is also MISSING for topography, so no surface could
      be validated even if one were created.'
    verified_alternative: 'Ask the machine owner to create or grade the surface by hand in Revit, then
      use the Cortex tools that already work on levels, walls, floors and rooms, or use the Horizun route
      that is PROVEN on this machine (P02-T12, 2026-09-15): horizun_execute_python called the Revit API
      Toposolid.Create for a synthetic 20x20 m surface and the result survived save/close/reopen (tool-lab/horizun/results/t12-toposolid.json).
      Cortex has no Python surface of its own, so this capability is owned by the Horizun provider.'
    catalog_scan:
      tools_matching_topo_site_grading_terrain_mass: []
      surface_based_tool_documented_for: floors and ceilings
  save:
    semantic: save
    availability: NOT_AVAILABLE
    justification: 'The published catalog has no document save tool. Every tool name and description was
      searched for save and close words: the only matches are save_selection, which stores a named selection
      filter, and sync_csv_parameters, which writes parameter values into the model. The pinned source
      confirms it: the only SaveAs calls in RevitCortex.Tools write family documents in a temporary folder
      (ExportFamiliesTool, ListFamilySizesTool) or an Excel workbook (ExportToExcelTool, WorkflowDataRoundtripTool);
      no tool calls Document.Save on the project, so a session through Cortex alone cannot prove disk
      persistence.'
    verified_alternative: 'The Horizun provider owns save and document session on this machine: horizun_save_document
      preserves the file and re-reads the on-disk timestamp and size, and horizun_document_session carries
      open, save_as, close and inspect. Both are already proven in tool-lab/horizun/results/ (P02-T08,
      P02-T12). A Cortex-only fixture must stay in memory and therefore cannot be used to claim persistence;
      the A/B smoke in P02-T15 has to record save and reopen as an explicit Cortex limitation rather than
      pick a lookalike tool.'
    catalog_scan:
      tools_matching_save_or_close:
      - save_selection
      - sync_csv_parameters
      project_save_calls_in_pinned_source: 0
  export_pdf:
    semantic: export_pdf
    availability: AVAILABLE

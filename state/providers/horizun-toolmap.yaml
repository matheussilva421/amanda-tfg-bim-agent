  dimensions:
    semantic: dimensions
    availability: AVAILABLE
    tools:
    - horizun_query_dimensions
    - horizun_edit_dimensions
    - horizun_plan_annotations
    alternatives:
    - horizun_get_dimension_references
    effect_flags:
      horizun_query_dimensions:
        effect: ReadOnly
        destructive: false
        open_world: false
      horizun_edit_dimensions:
        effect: MutatingUnlessDryRun
        destructive: false
        open_world: false
      horizun_plan_annotations:
        effect: ReadOnly
        destructive: false
        open_world: false
      horizun_get_dimension_references:
        effect: ReadOnly
        destructive: false
        open_world: false
    note: plan_annotations carries the automatic dimensioning operations; edit_dimensions changes placed
      dimensions
  site_toposolid:
    semantic: site_toposolid
    availability: NOT_AVAILABLE
    justification: No tool in the installed contract creates a topographic surface or toposolid from scratch.
      The only three contract tools that mention a toposolid are horizun_embed_floors_in_toposolid, horizun_grade_toposolid_around_floors
      and horizun_execute_plan, and both named tools require a toposolid that already exists; the element
      variant list of horizun_create_elements does not include a toposolid kind. The project site data
      is also MISSING for topography, so no surface could be validated even if one were created.
    verified_alternative: 'Create the surface once outside the creation path: either place the toposolid
      by hand in Revit and then use horizun_grade_toposolid_around_floors and horizun_embed_floors_in_toposolid,
      or request arbitrary Python with horizun_request_python_access and call the Revit API toposolid
      builder through horizun_execute_python. Both paths are recorded in tool-lab/horizun/tool-discovery.md.
      The Python route is now PROVEN on this machine (P02-T12, 2026-09-15): Toposolid.Create built a synthetic
      20x20 m surface in a committed transaction, typed queries re-read it, and it survived save/close/reopen.
      The hand-placed route stays unexercised.'
    proven_alternative: horizun_execute_python (Revit API Toposolid.Create; see tool-lab/horizun/results/t12-toposolid.json)
    contract_scan:
      tools_mentioning_toposolid:
      - horizun_embed_floors_in_toposolid
      - horizun_grade_toposolid_around_floors
      - horizun_execute_plan
      creation_tool_element_kinds:
      - accessory_inline
      - beam_system
      - cable_tray
      - ceiling
      - conduit
      - displacement
      - duct
      - family_instance
      - fitting
      - floor
      - grid
      - level
      - mep_system
      - pipe
      - roof
      - room
      - room_separator
      - shaft
      - slab_opening
      - stairs
      - structural_column
      - structural_framing
      - wall
      - wall_foundation
      - wall_opening
      - wall_profile
  save:
    semantic: save
    availability: AVAILABLE
    tools:
    - horizun_save_document
    - horizun_document_session
    alternatives:
    - horizun_open_document
    effect_flags:
      horizun_save_document:
        effect: Mutating
        destructive: false
        open_world: false
      horizun_document_session:
        effect: DocumentSession
        destructive: true
        open_world: true
      horizun_open_document:
        effect: Mutating
        destructive: false
        open_world: true
    note: save_document refuses a document that was never saved and proves the timestamp and size change
      on disk; document_session carries open, save_as, close and inspect
  export_pdf:
    semantic: export_pdf
    availability: AVAILABLE
    tools:
    - horizun_export
    - horizun_document_session
    alternatives:
    - horizun_capture_view
    format: pdf
    effect_flags:
      horizun_export:
        effect: MutatingUnlessDryRun
        destructive: true
        open_world: true
      horizun_document_session:
        effect: DocumentSession
        destructive: true
        open_world: true
      horizun_capture_view:
        effect: ExternalSideEffect
        destructive: false
        open_world: true
    note: combined or per-view PDFs with a closed print-policy field set, page-count re-read and an optional
      SHA256 manifest
  export_ifc:
    semantic: export_ifc
    availability: AVAILABLE
    tool: horizun_export
    format: ifc
    effect_flags:
      horizun_export:
        effect: MutatingUnlessDryRun
        destructive: true
        open_world: true
    note: IFC version, base quantities and split-walls policy come from the contract enum
  export_dwg:
    semantic: export_dwg
    availability: AVAILABLE
    tool: horizun_export
    format: dwg
    effect_flags:
      horizun_export:
        effect: MutatingUnlessDryRun
        destructive: true
        open_world: true
    note: one view per call; acad_version selects 2013 or 2018
  export_image:
    semantic: export_image
    availability: AVAILABLE
    tool: horizun_export
    alternatives:
    - horizun_capture_view
    format: image
    effect_flags:
      horizun_export:
        effect: MutatingUnlessDryRun
        destructive: true
        open_world: true
      horizun_capture_view:
        effect: ExternalSideEffect
        destructive: false
        open_world: true
    note: image export for one view; capture_view returns a PNG of the live view with orientation and
      display-style control
  python:
    semantic: python
    availability: PARTIAL
    tool: horizun_execute_python
    alternatives:
    - horizun_request_python_access
    effect_flags:
      horizun_execute_python:
        effect: Mutating
        destructive: true
        open_world: true
      horizun_request_python_access:
        effect: HostState
        destructive: false
        open_world: true
    note: 'disabled by default: request_python_access opens a consent dialog the machine owner must approve;
      preflight validates code without running it'
    proven_utc: '2026-09-15'
    proven: 'granted on this machine and exercised for real: horizun_execute_python ran transactions against
      revit/lab/horizun/LAB_HORIZUN_TOPO.rvt and its writes were re-read by typed queries and survived
      save/close/reopen (P02-T12, tool-lab/horizun/results/t12-toposolid.json). PARTIAL still means arbitrary
      Python is a policy-gated surface, not that it is unavailable.'

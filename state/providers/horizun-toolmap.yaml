    - start
    - end
    - level_id
    - height
    all_kind_fields:
    - arc
    - base_offset
    - end
    - flip
    - height
    - level_id
    - offset
    - parameters
    - source_reference
    - source_row
    - start
    - structural
    - top_level_id
    - top_offset
    - type_id
    effect_flags:
      horizun_create_elements:
        effect: MutatingUnlessDryRun

    - horizun_health
    effect_flags:
      get_document_info:
        effect: ReadOnly
        destructive: false
        open_world: false
      horizun_target:
        effect: HostState
        destructive: false
        open_world: true
      horizun_health:
        effect: ReadOnly
        destructive: false
        open_world: false
    note: read-only title, path, version and element count of the active document
  document_query:
    semantic: document_query
    availability: AVAILABLE
    tool: horizun_query_model
    alternatives:

  room:
    semantic: room
    availability: AVAILABLE
    tool: horizun_create_elements
    element_kind: room
    required_fields:
    - kind
    - point
    - level_id
    all_kind_fields:
    - level_id
    - name
    - number
    - parameters
    - point
    - source_reference
    - source_row
    effect_flags:
      horizun_create_elements:
        effect: MutatingUnlessDryRun
        destructive: false
        open_world: false

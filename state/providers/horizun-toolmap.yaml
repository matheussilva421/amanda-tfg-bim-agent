  window:
    semantic: window
    availability: AVAILABLE
    tool: horizun_create_elements
    element_kind: family_instance
    required_fields:
    - kind
    - point
    - type_id
    - coordinate_mode
    all_kind_fields:
    - coordinate_mode
    - host_id
    - level_id
    - parameters
    - point
    - rotation_degrees
    - source_reference
    - source_row

    effect_flags:
      horizun_manage_views:
        effect: MutatingUnlessDryRun
        destructive: false
        open_world: false
      horizun_plan_views:
        effect: ReadOnly
        destructive: false
        open_world: false
      horizun_navigate:
        effect: HostState
        destructive: false
        open_world: true
    note: floor, ceiling, structural, area, 3d, drafting, section, elevation and callout creation plus

      viewports on a sheet
  schedules:
    semantic: schedules
    availability: AVAILABLE
    tools:
    - horizun_create_schedule
    - horizun_manage_schedules
    - horizun_get_schedule_data
    - horizun_list_schedules
    effect_flags:
      horizun_create_schedule:
        effect: MutatingUnlessDryRun
        destructive: false
        open_world: false
      horizun_manage_schedules:
        effect: MutatingUnlessDryRun
        destructive: false
        open_world: false
      horizun_get_schedule_data:
        effect: ReadOnly
        destructive: false
        open_world: false
      horizun_list_schedules:
        effect: ReadOnly
        destructive: false
        open_world: false

- logical_id: LC-208-ART-55-P2
  title: Gabarito maximo municipal
  status: VERIFIED
  primary_source: Lei Complementar Municipal 208/2022 (Plano Diretor de Natal)
  source_version: LC 208/2022
  source_date: 2022-12-22
  article: Art. 55, paragrafo 2
  map_reference: not applicable (city-wide ceiling; AEITP excepted)
  extracted_rule: >-
    140 m is the maximum height for the whole city, excepting Areas of Special
    Tourist and Landscape Interest and subject to flight-approach and Embratel
    sightline protections.  It is a ceiling, not the height permitted on a lot:
    the workable height follows from the watershed floor-area ratio, the
    occupancy rate and the progressive setbacks of Annex II, Quadro 2.
  numeric_value: 140.0
  unit: metre
  scope: municipal height ceiling
  source_refs:
  - SRC-SUP-006#Tabela 3 corrigida, row 12
  - SRC-SUP-006#sobre o gabarito de 140 metros
  verification_evidence:
  - Confirmed in the secondary verification table, which also records that the
    source chapter misattributes this ceiling to the Zona Adensavel.
- logical_id: LC-208-ART-73-P7
  title: Area e dimensao maximas de quadra e de lote
  status: VERIFIED
  primary_source: Lei Complementar Municipal 208/2022 (Plano Diretor de Natal)
  source_version: LC 208/2022
  source_date: 2022-12-22
  article: Art. 73, paragrafos 6 e 7
  map_reference: not applicable
  extracted_rule: >-
    Maximum block area of 22.500 m2 and maximum block dimension of 150 m; by
    paragraph 6 the maximum lot area is that of the block.  The reported
    24.135 m2 exceeds this, which is why the lot area must be confirmed against
    the property certificate before any occupancy figure depends on it.
  numeric_value: 22500.0
  unit: square metre
  scope: block and lot subdivision limits
  source_refs:
  - SRC-SUP-006#Tabela 3 corrigida, row 14
  - SRC-SUP-006#achado 1, lote de 24.135 m2
  verification_evidence:
  - Confirmed in the secondary verification table that cites the article verbatim.
- logical_id: LC-208-ART-60-P5
  title: Afastamento minimo entre edificacoes do mesmo empreendimento
  status: VERIFIED
  primary_source: Lei Complementar Municipal 208/2022 (Plano Diretor de Natal)
  source_version: LC 208/2022
  source_date: 2022-12-22
  article: Art. 60, paragrafo 5
  map_reference: Quadro 2 do Anexo II (for the facade setbacks summed here)
  extracted_rule: >-
    In developments made of more than one building, the separation between them
    must be at least the sum of the setbacks required on the facing facades.
    A covered connecting floor between buildings, including ground or basement,
    makes them a single building.  This sizes the gardens between blocks and
    decides whether covered links collapse the parti into one volume.
  unit: >-
    not applicable (the distance is the sum of the two facing facade setbacks
    in Annex II, Quadro 2, which was not acquired and therefore contributes no
    number here)
  scope: multi-building developments
  source_refs:
  - SRC-SUP-006#Tabela 3 corrigida, row 11
  - SRC-SUP-006#achado 3, afastamento entre blocos
  verification_evidence:
  - Confirmed in the secondary verification table that cites the article verbatim.
- logical_id: LC-208-ART-62
  title: Fruicao publica em lotes com frente para mais de um logradouro
  status: VERIFIED
  primary_source: Lei Complementar Municipal 208/2022 (Plano Diretor de Natal)
  source_version: LC 208/2022
  source_date: 2022-12-22
  article: Art. 62 e paragrafo unico
  map_reference: not applicable
  extracted_rule: >-
    Applies to lots fronting more than one public way: a level free area with
    the pavement, minimum width of 4 m, minimum area of 50 m2 and a ceiling of
    20 per cent of the lot.  The sole paragraph grants buildable potential equal
    to 200 per cent of the area given to public fruition.
  numeric_value: 4.0
  unit: metre (minimum width of the public-fruition strip)
  scope: lots with more than one frontage
  source_refs:
  - SRC-SUP-006#Tabela 3 corrigida, achado 4
  verification_evidence:
  - Confirmed in the secondary verification table that cites the article verbatim.

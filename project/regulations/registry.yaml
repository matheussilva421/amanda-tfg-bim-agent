schema_version: 1
# Regulation registry for the CPChoque lot in Lagoa Nova, Natal/RN.
#
# Evidentiary rules this file obeys:
#   * VERIFIED means the primary text, version, date, article and the rule as
#     extracted were all inspected.  A numeric value only exists here when that
#     is true, because a remembered number is not a hard constraint.
#   * IDENTIFIED means the regulation is named by Amanda's material but the
#     primary text (or its annex) has not been acquired and read.  Those rows
#     deliberately carry no numeric_value.
#   * The LC208 verification document and the ATENDE cells of the spreadsheet
#     are secondary references.  They point at articles; they do not replace
#     reading the consolidated law.
#
# Source ids follow project/provenance/source-manifest.yaml.
rules:
- logical_id: LC-208-2022
  title: Lei Complementar 208/2022 - Plano Diretor de Natal
  status: IDENTIFIED
  primary_source: Lei Complementar Municipal 208/2022 (Plano Diretor de Natal)
  source_version: LC 208/2022
  source_date: 2022-12-22
  extracted_rule: >-
    Consolidated plan-director text governs macrozoning, occupancy, lotting and
    the 140 m city-wide height ceiling.  The secondary verification document
    records that LC 258/2024 and LC 261/2025 amended articles of this plan, so a
    consolidated current version must be confirmed before any parameter is
    treated as verified.
    This row is the umbrella entry for the law itself: it names no article and
    carries no numeric value, because the consolidated primary text was not
    acquired and read here.  Each parameter below is a separate row.
  scope: municipal territory, including the CPChoque lot
  source_refs:
  - SRC-SUP-006#verificacao urbanistica, page 1
  - SRC-SUP-006#verificacao urbanistica, ressalvas
  verification_evidence: []

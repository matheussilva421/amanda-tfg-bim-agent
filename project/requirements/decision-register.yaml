- decision_id: DEC-P08-T08-TYPOLOGY-001
  topic: TYPOLOGY
  alternatives: *id001
  selected_option: 'PROVISIONAL_ASSUMPTION: single-storey double-loaded bar with the
    service, arrival and community programme on the street face, the residential,
    children''s and technical programme on the protected patio face, and one covered
    gallery of 1.50 m between them.'
  rationale: Measurement settles the typology rather than taste. A courtyard of two
    separate wings assembled from the same 626 m2 of rooms with a gallery of the same
    width measures about 1050 m2 enclosed, roughly 30 percent above the adopted 783-814
    m2 budget, because it needs a second full gallery and a second set of external
    walls; the single double-loaded bar measures 784.88 m2 and reaches the adopted
    range without touching one room area. Every room still opens onto the gallery
    and takes daylight from its outer face, and the protected patio beside the residential
    face supplies the external space the programme requires. The patio is held off
    the public edge by the building and closed by the perimeter wall, stated as an
    assumption because only a study boundary exists.

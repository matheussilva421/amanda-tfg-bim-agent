      - "PROVISIONAL_ASSUMPTION: retain the equal-area planar study rectangle (24135 m2) anchored to the reported CPChoque road context"
    selected_option: "PROVISIONAL_ASSUMPTION: retain the equal-area planar study rectangle (24135 m2) anchored to the reported CPChoque road context"
    rationale: "The TFG reports the CPChoque site, its road context and an area of 24135 m2, but the project source set contains no cadastral identifier or verified polygon. GeoNatal exposes official parcel and block layers, and SEMURB's boundary service requires a registry or survey package; neither source was captured here as a parcel record for this lot. Retain the existing equal-area rectangle for STUDY only and keep final area, frontage, setback and permitting checks blocked."

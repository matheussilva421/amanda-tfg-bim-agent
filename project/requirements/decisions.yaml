  - decision_id: DEC-P08-T04-TYPOLOGY-001
    topic: TYPOLOGY
    alternatives:
      - "SIGILO_RESIDENTIAL_CASA_ABRIGO"
      - "INSTITUTIONAL_TEMPORARY_SHELTER_WITH_CONTROLLED_PUBLIC_INTERFACE"
      - "OPEN_PUBLIC_SERVICE_CENTER_WITH_EXPOSED_RESIDENTIAL_ACCESS"
    selected_option: "INSTITUTIONAL_TEMPORARY_SHELTER_WITH_CONTROLLED_PUBLIC_INTERFACE"
    rationale: "The TFG defines a temporary centre for women and children with a graduated sequence between shelter, transition and city, while the MDS architectural manual defines institutional shelter as temporary housing for up to 20 people with privacy, professional care and community integration. The selected study typology therefore keeps a protected residential core and a controlled urban interface; it does not expose residents or claim final operational approval."
    source_refs:
      - "SRC-TFG-001#pages-8-9,54,57-61"

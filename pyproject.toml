[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amanda-tfg-bim-agent"
version = "0.1.0"
description = "Local-first, fault-tolerant Codex-driven architecture/BIM pipeline for Amanda's TFG"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.16,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "rich>=14,<15",
  "shapely==2.1.2",
  "pypdf==6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "revit: requires running Revit and a verified provider",
  "slow: intentionally expensive"
]
